<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <!-- Background Pack Wrapper -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#bgGrad)" />
  <rect x="25" y="25" width="550" height="750" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#fbbf24" stroke-width="4" />

  <!-- Top Brand Banner -->
  <rect x="45" y="45" width="510" height="90" rx="10" fill="#78350f" />
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#fef3c7" text-anchor="middle" letter-spacing="2">APEX DELIGHT</text>
  <text x="300" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fde68a" text-anchor="middle">VANILLA CREAM BISCUITS</text>

  <!-- Product Illustration placeholder -->
  <circle cx="300" cy="220" r="65" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
  <circle cx="300" cy="220" r="50" fill="#f59e0b" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" />
  <text x="300" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">CRUNCHY</text>

  <!-- Legal Metrology Declarations Panel -->
  <rect x="45" y="310" width="510" height="430" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="45" y="310" width="510" height="32" rx="6" fill="#1e293b" />
  <text x="60" y="332" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MANDATORY STATUTORY DECLARATIONS</text>

  <!-- Declarations content -->
  <text x="65" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">1. COMMODITY:</text>
  <text x="210" y="370" font-family="Arial, sans-serif" font-size="15" fill="#334155">Apex Delight Cream Biscuits Vanilla</text>

  <text x="65" y="405" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">2. MANUFACTURED BY:</text>
  <text x="65" y="428" font-family="Arial, sans-serif" font-size="13" fill="#334155">Apex Foods Pvt. Ltd., Plot 42, Industrial Area, Sector 5,</text>
  <text x="65" y="448" font-family="Arial, sans-serif" font-size="13" fill="#334155">Haridwar, Uttarakhand - 249403</text>

  <line x1="65" y1="465" x2="535" y2="465" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Net Quantity & MRP -->
  <text x="65" y="495" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">3. NET QUANTITY:</text>
  <text x="220" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a">200 g</text>

  <text x="65" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">4. MRP:</text>
  <text x="220" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#047857">Rs. 40.00</text>
  <text x="310" y="535" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">(Tax clause omitted - Issue)</text>

  <text x="65" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">5. UNIT SALE PRICE:</text>
  <text x="220" y="570" font-family="Arial, sans-serif" font-size="14" fill="#334155">Rs. 0.20 per g</text>

  <text x="65" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">6. DATE OF PACKING:</text>
  <text x="220" y="605" font-family="Arial, sans-serif" font-size="14" fill="#334155">07/2026 | BATCH: APX-9824</text>

  <line x1="65" y1="625" x2="535" y2="625" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Intentionally missing Consumer Care Area -->
  <rect x="65" y="640" width="470" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-dasharray="4 4" />
  <text x="80" y="668" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#b91c1c">[MISSING CONSUMER CARE CELL / TOLL-FREE / EMAIL DECLARATION]</text>

  <text x="65" y="718" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">COUNTRY OF ORIGIN: INDIA</text>
</svg>
