<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" rx="20" fill="url(#dishGrad)" />
  <rect x="25" y="25" width="550" height="750" rx="14" fill="#ffffff" fill-opacity="0.97" stroke="#3b82f6" stroke-width="4" />

  <!-- Top Brand Banner -->
  <rect x="45" y="45" width="510" height="90" rx="10" fill="#1e3a8a" />
  <text x="300" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">NOVA CLEAN</text>
  <text x="300" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">LEMON POWER LIQUID DISHWASH</text>

  <!-- Legal Metrology Declarations Panel -->
  <rect x="45" y="160" width="510" height="590" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="45" y="160" width="510" height="32" rx="6" fill="#1e293b" />
  <text x="60" y="182" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">DECLARATIONS PANEL</text>

  <!-- Declarations content with intentionally microscopic/sub-sized text -->
  <text x="65" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">1. COMMODITY: Nova Clean Liquid Dishwash</text>

  <text x="65" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2. MANUFACTURED BY:</text>
  <!-- Microscopic text representation -->
  <text x="65" y="272" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Nova Household Goods, Building 14, Electronic City, Bengaluru, KA - 560100</text>

  <line x1="65" y1="290" x2="535" y2="290" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="65" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">3. NET QUANTITY:</text>
  <text x="210" y="325" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">500 ml (Font height: ~1.5 mm, Statutory Minimum: 4.0 mm)</text>

  <text x="65" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">4. MRP:</text>
  <text x="210" y="365" font-family="Arial, sans-serif" font-size="11" fill="#334155">₹115.00 (incl. of all taxes)</text>

  <text x="65" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">5. DATE OF PACKING:</text>
  <text x="220" y="405" font-family="Arial, sans-serif" font-size="11" fill="#334155">05/2026 | BATCH: NV-9901</text>

  <text x="65" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">6. CONSUMER CARE:</text>
  <text x="220" y="445" font-family="Arial, sans-serif" font-size="10" fill="#334155">Phone: 080-23456789</text>

  <!-- Warning callout -->
  <rect x="65" y="490" width="470" height="90" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
  <text x="80" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b45309">⚠️ FONT SIZE / READABILITY VIOLATION DETECTED:</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Estimated character height of numerals/letters is 1.5 mm.</text>
  <text x="80" y="565" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Rule 7 &amp; 8 mandates minimum 4.0 mm font height for 500 ml container size.</text>
</svg>
